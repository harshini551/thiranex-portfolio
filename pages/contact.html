<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
          content="Contact me through the accessible portfolio contact form.">

    <meta name="author" content="Your Name">

    <title>Contact Me | My Portfolio</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>

    <header>
        <nav aria-label="Main navigation">

            <a href="index.html" class="logo">
                My Portfolio
            </a>

            <ul>
                <li>
                    <a href="../index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="projects.html">Projects</a>
                </li>

                <li>
                    <a href="contact.html" aria-current="page">
                        Contact
                    </a>
                </li>
            </ul>

        </nav>
    </header>

    <main id="main-content">

        <section aria-labelledby="contact-title">

            <h1 id="contact-title">Contact Me</h1>

            <p>
                If you would like to get in touch, please fill out
                the form below.
            </p>

            <form action="#" method="post" aria-labelledby="contact-title">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-required="true"
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-required="true"
                    >

                </div>

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>

                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Your Name. All rights reserved.
        </p>
    </footer>

</body>
</html>
